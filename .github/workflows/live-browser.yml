name: Live browser acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run smoke
      - run: npm run smoke:dsh
      - run: npm run smoke:business
      - run: npm run test:real-world
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: .dsh-browser/
          if-no-files-found: ignore
          retention-days: 7
